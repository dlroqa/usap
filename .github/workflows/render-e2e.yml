# UI-preservation gate: real production build + real serve.cjs in a real browser.
#  * visual: pixel comparison against baselines of the ORIGINAL UI, per render target
#  * behaviour, accessibility (axe), live-backend smoke and fixture-drift checks
# Baselines are never written in a normal run. The guarded `update_baselines` dispatch
# only works while app/frontend is identical to tests/e2e/ORIGINAL_UI_COMMIT, and it only
# uploads proposed baselines for human review. See docs/ci/RENDER_TESTS.md.
name: render-e2e

on:
  pull_request:
  push:
    # ui-baseline/** branches run the guarded update mode (proposals only, never committed).
    branches: [main, "ui-baseline/**"]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Generate PROPOSED baselines from the original UI (uploaded as artifacts, never committed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-${{ github.event.pull_request.number || github.ref }}-${{ inputs.update_baselines || false }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"
  UPDATE: ${{ (inputs.update_baselines == true || startsWith(github.ref, 'refs/heads/ui-baseline/')) && '1' || '0' }}

jobs:
  render-linux:
    name: render (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pinned by digest: the rendering environment (fonts, Chromium, libs) must not drift under the baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    env:
      RENDER_TARGET: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Guard baseline update (original UI only)
        if: env.UPDATE == '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          original="$(cat tests/e2e/ORIGINAL_UI_COMMIT)"
          git diff --quiet "$original" HEAD -- app/frontend || { echo "::error::app/frontend differs from original UI commit $original; refusing to generate baselines"; exit 1; }
      - name: Build frontend
        run: cd app/frontend && npm ci --no-audit --no-fund && npm run build
      - name: Install e2e dependencies
        run: cd tests/e2e && npm ci --no-audit --no-fund
      - name: Run browser suite
        working-directory: tests/e2e
        run: |
          if [ "$UPDATE" = 1 ]; then
            A11Y_UPDATE_BASELINE=1 npx playwright test --update-snapshots=all
          else
            npx playwright test
          fi
      - name: Summary
        if: always()
        working-directory: tests/e2e
        run: node ../../scripts/ci/junit-summary.cjs test-results/junit.xml "render (linux-x64)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report, traces and screenshot diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-report-linux-x64
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload PROPOSED baselines (review before committing)
        if: env.UPDATE == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-baselines-linux-x64
          path: |
            tests/e2e/specs/__screenshots__/linux-x64/
            tests/e2e/specs/a11y-baseline.json
          retention-days: 7
          if-no-files-found: error

  render-native:
    name: render (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pixel baselines are kept for each macOS architecture (required by the dual-arch policy).
          - { label: macos-arm64,  runner: macos-15,       arch: arm64,  visual: true }
          - { label: macos-x86_64, runner: macos-15-intel, arch: x86_64, visual: true }
          # Windows: behaviour, a11y and live-backend specs; no pixel baselines.
          - { label: windows-x64,  runner: windows-2025,   arch: x86_64, visual: false }
    env:
      RENDER_TARGET: ${{ matrix.label }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify runner architecture
        run: |
          echo "uname -m=$(uname -m) node=$(node -p process.arch) required=${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Guard baseline update (original UI only)
        if: env.UPDATE == '1'
        run: |
          original="$(cat tests/e2e/ORIGINAL_UI_COMMIT)"
          git diff --quiet "$original" HEAD -- app/frontend || { echo "::error::app/frontend differs from original UI commit $original"; exit 1; }
      - name: Build frontend
        run: cd app/frontend && npm ci --no-audit --no-fund && npm run build
      - name: Install e2e dependencies and Chromium
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund && npx playwright install chromium
      - name: Run browser suite
        working-directory: tests/e2e
        run: |
          specs=""
          if [ "${{ matrix.visual }}" != "true" ]; then specs="specs/behavior.spec.mjs specs/a11y.spec.mjs specs/live-backend.spec.mjs"; fi
          if [ "$UPDATE" = 1 ] && [ "${{ matrix.visual }}" = "true" ]; then
            npx playwright test --update-snapshots=all $specs
          else
            npx playwright test $specs
          fi
      - name: Summary
        if: always()
        working-directory: tests/e2e
        run: node ../../scripts/ci/junit-summary.cjs test-results/junit.xml "render (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report, traces and screenshot diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-report-${{ matrix.label }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload PROPOSED baselines (review before committing)
        if: env.UPDATE == '1' && matrix.visual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-baselines-${{ matrix.label }}
          path: tests/e2e/specs/__screenshots__/${{ matrix.label }}/
          retention-days: 7
          if-no-files-found: error
