# bench-217-coalition: XNU coalition attribution proof of concept for #217 (bench branch only; never merged, never a PR).
# Runs bench/217-coalition/coalition_poc.py once on the two hosted macOS runners. Unprivileged; it signals only processes
# its own fixtures reported (identity re-checked first); every fixture exits by itself within 90 s.
name: bench-217-coalition

on:
  push:
    branches: [bench/217-coalition-poc]

permissions:
  contents: read

concurrency:
  group: bench-217-coalition
  cancel-in-progress: false

jobs:
  coalition-poc:
    name: coalition-poc (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macos-arm64,  runner: macos-15 }
          - { label: macos-x86_64, runner: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: environment
        run: |
          sw_vers; uname -a; python3 --version; sysctl -n hw.ncpu; uptime
          echo "runner ancestry:"; p=$$; while [ "$p" -gt 1 ]; do ps -o pid=,ppid=,user=,comm= -p "$p"; p=$(ps -o ppid= -p "$p" | tr -d ' '); done
      - name: coalition PoC (native)
        run: python3 -I bench/217-coalition/coalition_poc.py
      - name: leftover check (own fixtures only, report only)
        if: always()
        run: |
          sleep 2
          ps -axo pid,ppid,pgid,user,lstart,command | grep -E 'coalition_poc|com\.usap\.coalpoc' | grep -v grep || echo "no PoC processes left"
          launchctl list | grep com.usap.coalpoc || echo "no PoC launchd job left"
      - name: remove own launchd job if the PoC crashed (own label prefix only)
        if: always()
        run: |
          for l in $(launchctl list | awk '{print $3}' | grep '^com\.usap\.coalpoc\.' || true); do echo "removing own $l"; launchctl remove "$l" || true; done
