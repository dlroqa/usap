# Issue #151 (json-413 concurrent test: a client receives no answer, macOS Intel). Bench branch only
# (bench/151-json413-macos): never merged, never a required check. Round 2: the real unit suite exactly as CI runs
# it, with bench-only kernel queue snapshots and event-loop gap records (round 3).
name: bench-151

on:
  push:
    branches: [bench/151-json413-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite (macOS Intel, run ${{ matrix.run }})
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
      - name: Unit suite as in CI (json-413 instrumented)
        shell: bash
        run: |
          set +e
          node --test --test-timeout=600000 --test-reporter=spec "scripts/tests/*.test.cjs" > suite.log 2>&1
          echo "suite exit $?"
          grep -E "concurrent over-limit|AssertionError.*client [0-9]|ℹ (pass|fail)" suite.log | cut -c1-3000
          exit 0
