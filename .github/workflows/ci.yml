# CI: reproducible frontend build, server syntax check, unit + security
# regression tests (incl. a real serve.cjs boot with no models) on all three
# desktop OSes. Required check for PRs to main. See docs/ci/CI_GUIDE.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Same Node version the portable launchers install (scripts/setup/setup.sh NODE_VERSION).
  NODE_VERSION: "22.12.0"

jobs:
  build-test:
    # Job names are branch-protection required checks: keep labels stable.
    name: build-test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,      runner: ubuntu-24.04,   arch: x86_64, node_arch: x64 }
          - { label: windows-x64,    runner: windows-2025,   arch: x86_64, node_arch: x64 }
          - { label: macos-arm64,    runner: macos-15,       arch: arm64,  node_arch: arm64 }
          - { label: macos-x86_64,   runner: macos-15-intel, arch: x86_64, node_arch: x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Verify runner and Node architecture
        run: |
          actual="$(uname -m)"
          node_arch="$(node -p process.arch)"
          echo "Runner ${{ matrix.runner }}: uname -m=$actual, node=$node_arch (required ${{ matrix.arch }} / ${{ matrix.node_arch }})"
          echo "### ${{ matrix.label }}: uname -m=$actual, node process.arch=$node_arch" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "${{ matrix.arch }}" || { echo "::error::runner arch $actual != ${{ matrix.arch }}"; exit 1; }
          test "$node_arch" = "${{ matrix.node_arch }}" || { echo "::error::node arch $node_arch != ${{ matrix.node_arch }} (translated binary?)"; exit 1; }

      - name: Install frontend dependencies (lockfile enforced)
        working-directory: app/frontend
        run: npm ci --no-audit --no-fund

      - name: Syntax-check server, search and worker scripts
        run: |
          for f in scripts/server/*.cjs scripts/search/*.js scripts/workers/*.mjs scripts/tests/*.cjs; do
            node --check "$f" || { echo "::error file=$f::syntax check failed"; exit 1; }
          done

      - name: Build frontend (vite build -> app/dist)
        working-directory: app/frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f app/dist/index.html || { echo "::error::app/dist/index.html missing"; exit 1; }
          grep -Eq 'src="/assets/index-[^"]+\.js"' app/dist/index.html || { echo "::error::entry script missing from index.html"; exit 1; }
          if find app/dist -name '*.map' | grep -q .; then echo "::error::source maps found in release build"; exit 1; fi
          { echo "### Build output ($RUNNER_OS)"; echo '```'; ls -l app/dist app/dist/assets | grep -Ev 'KaTeX_|inter-'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit, regression and security tests
        run: |
          mkdir -p test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml \
            "scripts/tests/*.test.cjs"

      - name: Test summary
        if: always()
        run: |
          if [ -f test-results/junit.xml ]; then
            node -e '
              const x = require("fs").readFileSync("test-results/junit.xml", "utf8");
              const n = (re) => (x.match(re) || []).length;
              console.log(`### Tests (${process.env.RUNNER_OS}): ${n(/<testcase /g)} run, ${n(/<failure/g)} failed, ${n(/<skipped/g)} skipped`);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Tests ($RUNNER_OS): no JUnit report produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.label }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload built frontend (web assets only, not a portable bundle)
        if: matrix.label == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: app/dist/
          retention-days: 7
          if-no-files-found: error
