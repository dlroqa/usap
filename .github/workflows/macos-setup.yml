# Real macOS first-time setup + runtime validation on NATIVE Apple Silicon and Intel
# runners: mac.sh first launch (downloads the real engines), native-architecture checks of
# every binary, engine startup, and real inference through the app API with small pinned
# models; then a second launch that must start without re-running setup.
# Heavy (≈1 GB downloads), so it runs when setup/launcher/server code changes, weekly,
# and on demand. It is path-filtered, so it is NOT a branch-protection required check
# (a required check that does not run would block unrelated PRs).
name: macos-setup

on:
  pull_request:
    paths:
      - "mac.sh"
      - "scripts/setup/**"
      - "scripts/server/**"
      - "scripts/workers/**"
      - "scripts/ci/macos-runtime-validate.sh"
      - ".github/workflows/macos-setup.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-validate:
    name: macos-setup (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macos-arm64,  runner: macos-15,       arch: arm64 }
          - { label: macos-x86_64, runner: macos-15-intel, arch: x86_64 }
    env:
      FRONTEND_PORT: "14900"
      # CI skips the optional Core ML (ANE) Python stack; it stays unverified.
      USAP_SKIP_COREML: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert native hardware (no Rosetta)
        run: |
          hw="$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)"; tr="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          echo "uname -m=$(uname -m) hw.optional.arm64=$hw translated=$tr cpu=$(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "${{ matrix.arch }}" && test "$tr" = 0
          if [ "${{ matrix.arch }}" = x86_64 ]; then test "$hw" = 0; else test "$hw" = 1; fi

      - name: First launch via mac.sh (runs first-time setup)
        run: |
          mkdir -p ci-logs
          ( yes '' | ./mac.sh > ci-logs/first-launch.log 2>&1 & )
          for i in $(seq 1 270); do
            if curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null; then echo "server up after $((i*10))s"; break; fi
            if grep -q "Setup failed" ci-logs/first-launch.log; then break; fi
            sleep 10
          done
          tail -60 ci-logs/first-launch.log
          grep -q "First-Time Setup" ci-logs/first-launch.log || { echo "::error::expected first-time setup on a fresh checkout"; exit 1; }
          curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null || { echo "::error::server did not start after setup"; exit 1; }

      - name: Validate binaries, startup and real inference
        run: |
          {
            echo "## macOS runtime validation (${{ matrix.label }})"
            EXPECTED_ARCH=${{ matrix.arch }} BASE="http://127.0.0.1:$FRONTEND_PORT" RESULTS=ci-logs/runtime-results.jsonl \
              bash scripts/ci/macos-runtime-validate.sh
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cp ci-image.png ci-logs/generated-image.png 2>/dev/null || true
          ! grep -q '"status":"FAIL"' ci-logs/runtime-results.jsonl

      - name: Stop first launch
        if: always()
        run: |
          lsof -ti "tcp:$FRONTEND_PORT" | xargs kill 2>/dev/null || true
          pkill -f "scripts/server/serve.cjs" || true
          pkill -f "llama-server|whisper-server|tts-kokoro-worker" || true
          sleep 3

      - name: Second launch must not re-run setup
        run: |
          ( yes '' | ./mac.sh > ci-logs/second-launch.log 2>&1 & )
          for i in $(seq 1 60); do curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null && break; sleep 5; done
          curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null || { tail -40 ci-logs/second-launch.log; echo "::error::second launch did not start"; exit 1; }
          if grep -qE "First-Time Setup|Reason:" ci-logs/second-launch.log; then
            grep -E "Reason:" ci-logs/second-launch.log; echo "::error::launcher re-entered setup on an installed system"; exit 1
          fi
          echo "Second launch started without setup." | tee -a "$GITHUB_STEP_SUMMARY"
          lsof -ti "tcp:$FRONTEND_PORT" | xargs kill 2>/dev/null || true

      - name: Upload logs and results (no models)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-setup-${{ matrix.label }}
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn
