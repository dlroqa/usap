# Real first-time setup + native runtime validation per OS/arch: launcher first launch
# (downloads the real engines), architecture/startup checks of every binary, real inference
# through the app API (chat, transcription, voice, image) with small pinned models, then a
# second launch that must start without re-running setup. Hosted runners have no GPU, so
# inference runs on the CPU; GPU results need a self-hosted runner (docs/ci/RUNNER_REQUIREMENTS.md).
# Heavy (~3 GB downloads), so it runs when setup/launcher/server code changes, weekly and on
# demand. It is path-filtered, so it is NOT a branch-protection required check.
name: native-runtime

on:
  pull_request:
    paths:
      - "mac.sh"
      - "linux.sh"
      - "windows.bat"
      - "scripts/setup/**"
      - "scripts/server/**"
      - "scripts/workers/**"
      - "scripts/search/**" # web text that enters chat prompts (token filter, page extraction)
      - "scripts/ci/runtime-validate.sh"
      - "scripts/ci/chat-queue-validate.cjs"
      - "scripts/ci/observe-json.cjs"
      - "scripts/ci/resources-timing.cjs"
      - "scripts/tests/api-contract/resources-timing-preload.cjs"
      - "scripts/ci/chat-timeouts-validate.cjs"
      - "scripts/ci/memory-admission-validate.cjs"
      - "scripts/ci/engine-lifecycle-validate.cjs"
      - "scripts/ci/voice-queue-validate.cjs"
      - "scripts/ci/transcription-queue-validate.cjs"
      - "scripts/ci/image-queue-validate.cjs"
      - "scripts/ci/image-queue-memprobe.cjs"
      - "scripts/ci/p4-token-check.cjs"
      - "scripts/ci/p4-fixed-document-id.cjs"
      - "scripts/ci/memory-check-report.cjs"
      - "scripts/ci/stop-app.sh"
      - ".github/workflows/native-runtime.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-validate:
    name: native-runtime (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          # image: backends exercised for image generation. "cpu" must pass; GPU backends are
          # attempted and recorded as UNSUPPORTED/UNAVAILABLE on hosted runners (no usable GPU).
          - { label: macos-arm64,  runner: macos-15,       arch: arm64,  launcher: ./mac.sh,   image: "cpu metal" }
          # Intel: upstream's universal sd has an SSE3-only x86_64 slice (no AVX/AVX2/FMA); CPU image
          # generation is slower than on Linux x64 but fits the timeout (docs/ci/MACOS_COMPATIBILITY.md).
          - { label: macos-x86_64, runner: macos-15-intel, arch: x86_64, launcher: ./mac.sh,   image: "cpu metal" }
          - { label: linux-x64,    runner: ubuntu-24.04,   arch: x86_64, launcher: ./linux.sh, image: "cpu vulkan" }
          # Git Bash drives windows.bat through cmd; piped empty lines answer its "press any key" prompts.
          - { label: windows-x64,  runner: windows-2025,   arch: x86_64, launcher: "cmd //c windows.bat", image: "cpu vulkan" }
    env:
      FRONTEND_PORT: "14900"
      # CI skips the optional Core ML (ANE) Python stack; it stays unverified.
      USAP_SKIP_COREML: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert native hardware (no Rosetta)
        if: runner.os == 'macOS'
        run: |
          hw="$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)"; tr="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          echo "uname -m=$(uname -m) hw.optional.arm64=$hw translated=$tr cpu=$(sysctl -n machdep.cpu.brand_string)"
          test "$(uname -m)" = "${{ matrix.arch }}" && test "$tr" = 0
          if [ "${{ matrix.arch }}" = x86_64 ]; then test "$hw" = 0; else test "$hw" = 1; fi

      - name: Assert native hardware (Windows x64)
        if: runner.os == 'Windows'
        run: |
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE uname -m=$(uname -m)"
          test "$PROCESSOR_ARCHITECTURE" = AMD64 && test "$(uname -m)" = x86_64

      - name: First launch via the launcher (runs first-time setup)
        run: |
          mkdir -p ci-logs
          ( yes '' | ${{ matrix.launcher }} > ci-logs/first-launch.log 2>&1 & )
          for i in $(seq 1 270); do
            if curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null; then echo "server up after $((i*10))s"; break; fi
            if grep -q "Setup failed" ci-logs/first-launch.log; then break; fi
            sleep 10
          done
          tail -60 ci-logs/first-launch.log
          grep -q "First-Time Setup" ci-logs/first-launch.log || { echo "::error::expected first-time setup on a fresh checkout"; exit 1; }
          curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null || { echo "::error::server did not start after setup"; exit 1; }

      - name: Validate binaries, startup and real inference
        run: |
          {
            echo "## Native runtime validation (${{ matrix.label }})"
            EXPECTED_ARCH=${{ matrix.arch }} BASE="http://127.0.0.1:$FRONTEND_PORT" RESULTS=ci-logs/runtime-results.jsonl \
              IMAGE_BACKENDS="${{ matrix.image }}" IMAGE_SIZE="${{ matrix.size || 256 }}" IMAGE_STEPS="${{ matrix.steps || 4 }}" \
              SERVER_LOG=ci-logs/first-launch.log \
              bash scripts/ci/runtime-validate.sh
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in ci-image-*.png; do [ -s "$f" ] && cp "$f" "ci-logs/generated-${f#ci-}"; done; true
          ! grep -q '"status":"FAIL"' ci-logs/runtime-results.jsonl

      - name: Stop first launch
        if: always()
        run: bash scripts/ci/stop-app.sh

      # Step 9.9c bounded chat queue, real model, opt-in: the queue is switched on only in the environment of the
      # test servers this script starts (port 14920); the installed default stays off. Real Qwen2.5 0.5B Q4_K_M
      # (installed by the validation step above) on the CPU.
      - name: Chat queue with a real model (queue on for test servers only)
        run: |
          set -o pipefail
          node scripts/ci/chat-queue-validate.cjs --model qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --results ci-logs/chat-queue-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop chat queue test servers
        if: always()
        env:
          FRONTEND_PORT: "14920"
        run: bash scripts/ci/stop-app.sh

      # Step 9.9f-1 chat timeouts, real model, opt-in: switched on only in the environment of the test servers this
      # script starts (port 14930); the installed default stays off (its first check). It suspends only its own
      # engine process (found by port) and always resumes it.
      - name: Chat timeouts with a real model (on for test servers only)
        run: |
          set -o pipefail
          node scripts/ci/chat-timeouts-validate.cjs --model qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --results ci-logs/chat-timeouts-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop chat timeout test servers
        if: always()
        env:
          FRONTEND_PORT: "14930"
        run: |
          # A process left stopped by a failed run would ignore SIGTERM: continue it first (POSIX only).
          if [ "$RUNNER_OS" != "Windows" ]; then pkill -CONT -f "llama-server" || true; fi
          bash scripts/ci/stop-app.sh

      # Step 9.9f-2 memory admission, real model, opt-in: switched on only in the environment of the test servers this
      # script starts (port 14950); the installed default stays off (its first check). It never exhausts the runner's
      # memory: a test-only setting inflates the estimated need. Linux can refuse; Windows and macOS readings aren't
      # validated for refusals, so there the refusal path is UNSUPPORTED by design and "never refused" is checked.
      - name: Memory admission with a real model (on for test servers only)
        run: |
          set -o pipefail
          node scripts/ci/memory-admission-validate.cjs --model qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --results ci-logs/memory-admission-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop memory admission test servers
        if: always()
        env:
          FRONTEND_PORT: "14950"
        run: bash scripts/ci/stop-app.sh

      # Issue #105 cross-engine model-load coordination, real engines, opt-in: engineSlot is switched on only in the
      # environment of the test servers this script starts (port 14960); the installed default stays off (its first
      # check). Real Qwen2.5 0.5B and Stable Diffusion 1.5 Q4_0 on the CPU; GPU/NPU paths are recorded UNAVAILABLE.
      - name: Engine lifecycle with real engines (engineSlot on for test servers only)
        run: |
          set -o pipefail
          node scripts/ci/engine-lifecycle-validate.cjs --text qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --image stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf \
            --results ci-logs/engine-lifecycle-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop engine lifecycle test servers
        if: always()
        env:
          FRONTEND_PORT: "14960"
        run: bash scripts/ci/stop-app.sh

      # Step 9.9f-3 voice: a baseline of today's unbounded Kokoro chain with the real worker on the CPU (measurements
      # and observed legacy behaviour), then, when the voice queue exists in this checkout, the queue checks with
      # voiceQueue on only for the script's own test server (port 14970); the installed default stays off.
      - name: Voice queue with the real Kokoro worker (voiceQueue on for test servers only)
        # Independent of the steps before it (it starts its own servers): it still runs, and the job still fails,
        # when an earlier check failed, so its evidence isn't lost to an unrelated failure.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/ci/voice-queue-validate.cjs --model kokoro-onnx-q8.json \
            --results ci-logs/voice-queue-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop voice queue test servers
        if: always()
        env:
          FRONTEND_PORT: "14970"
        run: bash scripts/ci/stop-app.sh

      # Step 9.9f-3 transcription: a baseline of today's unbounded Whisper chain with the real whisper-cli on the CPU,
      # then the transcription queue checks with transcriptionQueue on only for the script's own test servers (port
      # 14975); the installed default stays off. Uses the model and sample installed by the runtime validation above.
      - name: Transcription queue with the real whisper-cli (transcriptionQueue on for test servers only)
        # Independent of the steps before it (it starts its own servers): it still runs, and the job still fails,
        # when an earlier check failed, so its evidence isn't lost to an unrelated failure.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/ci/transcription-queue-validate.cjs --model ggml-tiny.en.bin --wav .ci-model-cache/jfk.wav \
            --results ci-logs/transcription-queue-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop transcription queue test servers
        if: always()
        env:
          FRONTEND_PORT: "14975"
        run: bash scripts/ci/stop-app.sh

      # Step 9.9f-3 image generation: the image queue with the real sd-server (SD 1.5 Q4_0) on the CPU, with imageQueue
      # and engineSlot on only for the script's own test servers (port 14985); the installed default stays off (its
      # first check). Includes the design's D6 measurement: resident memory of the studio, the engine and the client
      # while the studio holds three 64 MiB request bodies (never sent to the engine), with a stop condition.
      - name: Image queue with the real sd-server (imageQueue on for test servers only)
        # Independent of the steps before it (it starts its own servers): it still runs, and the job still fails,
        # when an earlier check failed, so its evidence isn't lost to an unrelated failure.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/ci/image-queue-validate.cjs --image stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf \
            --results ci-logs/image-queue-results.jsonl --logs ci-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop image queue test servers
        if: always()
        env:
          FRONTEND_PORT: "14985"
        run: bash scripts/ci/stop-app.sh

      - name: Second launch must not re-run setup
        run: |
          ( yes '' | ${{ matrix.launcher }} > ci-logs/second-launch.log 2>&1 & )
          for i in $(seq 1 60); do curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null && break; sleep 5; done
          curl -fs "http://127.0.0.1:$FRONTEND_PORT/api/health" >/dev/null || { tail -40 ci-logs/second-launch.log; echo "::error::second launch did not start"; exit 1; }
          if grep -qE "First-Time Setup|Reason:" ci-logs/second-launch.log; then
            grep -E "Reason:" ci-logs/second-launch.log; echo "::error::launcher re-entered setup on an installed system"; exit 1
          fi
          echo "Second launch started without setup." | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/ci/stop-app.sh

      - name: Upload logs and results (no models)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.label }}
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn
