# Issue #142 round 3 (listen diagnostics). Bench branch only (bench/142-r3-listen-diag): never merged, never a required check.
# macOS Intel (where R2 failed). Runs R2 60 times per job under CPU load with an observation-only patch and PR #144's
# fake sd-server (start / listen / exit records, holders of a taken port), on main and on PR #141's head. Assertions are unchanged; nothing is pushed.
name: bench-142-r3

on:
  push:
    branches: [bench/142-r3-listen-diag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2:
    name: bench-142 (${{ matrix.name }}, load ${{ matrix.load }})
    runs-on: macos-15-intel
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: main-d598f09, ref: d598f096d9a149de694dcc548b3e040778456c36, load: cpu4 }
          - { name: pr141-e8158cf, ref: e8158cf3ceed4fd65090beb2dfd6a67532fea958, load: cpu4 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: bench-src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
      - name: Runner facts
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu; node -v; git -C target log --oneline -1
          sysctl net.inet.ip.portrange.first net.inet.ip.portrange.last net.inet.ip.portrange.hifirst net.inet.ip.portrange.hilast || true
      - name: PR #144 fixture diagnostics (fake sd-server + harness reader; test files only)
        run: |
          git -C target fetch -q origin 63fbda564ce5fedaf109c286caf085a2500939fb 2>/dev/null || git -C target fetch -q origin test/fake-sd-listen-diagnostics-142
          git -C target show 63fbda5:scripts/tests/api-contract/fake-sd-server.cjs > target/scripts/tests/api-contract/fake-sd-server.cjs
          git -C target show 63fbda5:scripts/tests/api-contract/harness.cjs > target/scripts/tests/api-contract/harness.cjs
          git -C target diff --stat
      - name: Observation-only patch of R2 (assertions unchanged)
        run: node bench-src/bench/142-r2/patch-r2.cjs target/scripts/tests/engine-slot.test.cjs
      - name: Run R2 30 times
        timeout-minutes: 80
        run: |
          if [ "${{ matrix.load }}" = cpu4 ]; then for k in 1 2 3 4; do ( node -e "const end = Date.now() + 4800000; while (Date.now() < end) {}" & ); done; fi
          bash bench-src/bench/142-r2/loop.sh 60
          pkill -f "while \(Date.now\(\) < end\)" || true
      - name: Leftover engine processes at the end
        if: always()
        run: ps -axo pid=,ppid=,pgid=,etime=,args= | grep -E "usap-contract-|sd-server" | grep -v grep || echo none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-142-r3-${{ matrix.name }}-${{ matrix.load }}
          path: out/
          retention-days: 30
